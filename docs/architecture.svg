<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram of the ShopLedger browser interface, Express server, four routers, library modules, configuration and JSON data store, with a numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#526078}
      .head{font-size:15px;font-weight:700}.body{font-size:12px}.small{font-size:12px;fill:#526078}
      .box{fill:#fff;stroke:#9aa8bc;stroke-width:1.4}.group{fill:#f6f8fc;stroke:#cbd5e1;stroke-width:1.4}
      .focus{fill:#fff2cf;stroke:#d18b00;stroke-width:2}.tag{font-size:12px;font-weight:700;fill:#815500}
      .connector{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#flowArrow)}
      .dash{stroke-dasharray:5 4}
      .num{fill:#2563eb;stroke:#fff;stroke-width:1.4}
      .numtxt{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="32" y="42" class="title">ShopLedger | application architecture</text>
  <text x="32" y="65" class="sub">Express POS, customer Khata, stock and GST invoice flow · arrows show code dependencies and the numbered checkout path</text>

  <!-- Top-level runtime -->
  <rect x="32" y="88" width="245" height="108" rx="10" class="box"/>
  <text x="50" y="115" class="head">Browser UI · public/</text>
  <text x="50" y="138" class="body">index.html · css/style.css</text>
  <text x="50" y="158" class="body">js/app.js · cart + API requests</text>
  <text x="50" y="180" class="small">Loads product, order, Khata, report views</text>

  <rect x="370" y="88" width="360" height="108" rx="10" class="box"/>
  <text x="390" y="115" class="head">server.js · Express application</text>
  <text x="390" y="138" class="body">Serves public/ · parses JSON · mounts routers at /api</text>
  <text x="390" y="158" class="body">GET /orders/:id/invoice → invoice.render(order)</text>
  <text x="390" y="180" class="small">Uses config.port · exports app</text>

  <rect x="830" y="88" width="338" height="108" rx="10" class="box"/>
  <text x="850" y="115" class="head">config.js</text>
  <text x="850" y="138" class="body">shop identity · port · adminKey</text>
  <text x="850" y="158" class="body">tax.defaultRate + tax.hsnSlabs</text>
  <text x="850" y="180" class="body">inventory defaults · coupons</text>

  <path d="M277 142 H370" class="connector"/>
  <path d="M730 142 H830" class="connector"/>
  <text x="295" y="132" class="small">HTTP / static</text>
  <text x="755" y="132" class="small">settings</text>

  <!-- Routers -->
  <rect x="32" y="225" width="1136" height="129" rx="12" class="group"/>
  <text x="50" y="250" class="head">routes/ · mounted by server.js under /api</text>
  <rect x="50" y="266" width="250" height="70" rx="8" class="box"/>
  <text x="65" y="289" class="head">products.js</text>
  <text x="65" y="311" class="body">GET /products · GET /coupons</text>
  <rect x="320" y="266" width="270" height="70" rx="8" class="box"/>
  <text x="335" y="289" class="head">orders.js</text>
  <text x="335" y="311" class="body">GET /orders · POST /orders · cancel</text>
  <rect x="610" y="266" width="250" height="70" rx="8" class="box"/>
  <text x="625" y="289" class="head">customers.js</text>
  <text x="625" y="311" class="body">GET /customers · POST settle</text>
  <rect x="880" y="266" width="270" height="70" rx="8" class="box"/>
  <text x="895" y="289" class="head">reports.js</text>
  <text x="895" y="311" class="body">dashboard · GST recon · pricing preview</text>

  <path d="M535 196 V214 H455 V266" class="connector"/>
  <path d="M535 214 H1000 V266" class="connector"/>
  <path d="M535 214 H735 V266" class="connector"/>
  <path d="M535 214 H175 V266" class="connector"/>

  <!-- Lib modules -->
  <rect x="32" y="386" width="824" height="358" rx="12" class="group"/>
  <text x="50" y="412" class="head">lib/ · business logic and persistence helpers</text>

  <rect x="52" y="434" width="242" height="96" rx="8" class="focus"/>
  <text x="67" y="457" class="head">invoice.js</text><text x="67" y="478" class="body">computeInvoiceFigures(order)</text>
  <text x="67" y="498" class="body">render(order) → printable HTML</text>
  <text x="67" y="518" class="tag">TICKET FOCUS</text>

  <rect x="312" y="434" width="242" height="96" rx="8" class="focus"/>
  <text x="327" y="457" class="head">tax.js</text><text x="327" y="478" class="body">getRateForItem(item)</text>
  <text x="327" y="498" class="body">getSlabPercent · splitCgstSgst</text>
  <text x="327" y="518" class="tag">CHECKOUT GST INPUT</text>

  <rect x="572" y="434" width="242" height="96" rx="8" class="box"/>
  <text x="587" y="457" class="head">pricing.js</text><text x="587" y="478" class="body">subtotal(items) · discount()</text>
  <text x="587" y="498" class="body">computeTotals(items, code)</text>
  <text x="587" y="518" class="small">Checkout amounts + per-line GST</text>

  <rect x="52" y="548" width="242" height="76" rx="8" class="box"/>
  <text x="67" y="572" class="head">coupons.js</text><text x="67" y="594" class="body">normalizeCode · validate · calculateDiscount</text>
  <rect x="312" y="548" width="242" height="76" rx="8" class="box"/>
  <text x="327" y="572" class="head">inventory.js</text><text x="327" y="594" class="body">find · check · reserve · release</text>
  <rect x="572" y="548" width="242" height="76" rx="8" class="box"/>
  <text x="587" y="572" class="head">orders.js</text><text x="587" y="594" class="body">add · get · cancel · list</text>

  <rect x="52" y="642" width="176" height="76" rx="8" class="box"/>
  <text x="67" y="666" class="head">ledger.js</text><text x="67" y="688" class="body">Khata + settlements</text>
  <rect x="240" y="642" width="176" height="76" rx="8" class="box"/>
  <text x="255" y="666" class="head">store.js</text><text x="255" y="688" class="body">read · write · appendAudit</text>
  <rect x="428" y="642" width="176" height="76" rx="8" class="box"/>
  <text x="443" y="666" class="head">reports.js</text><text x="443" y="688" class="body">dashboard · GST recon</text>
  <rect x="616" y="642" width="198" height="76" rx="8" class="box"/>
  <text x="631" y="666" class="head">dates.js</text><text x="631" y="688" class="body">today · date keys · fiscal year</text>

  <path d="M610 196 V376 H175 V434" class="connector"/>
  <!-- data and legend -->
  <rect x="900" y="386" width="268" height="117" rx="10" class="box"/>
  <text x="920" y="413" class="head">data/db.json</text>
  <text x="920" y="436" class="body">Products · customers · orders</text>
  <text x="920" y="456" class="body">settlements · auditLog · ID counters</text>
  <text x="920" y="480" class="small">Read/written by lib/store.js</text>

  <rect x="900" y="520" width="268" height="113" rx="10" class="group"/>
  <text x="920" y="546" class="head">Legend</text>
  <rect x="920" y="559" width="18" height="16" rx="3" class="focus"/>
  <text x="948" y="572" class="body">Ticket focus / GST logic used at checkout</text>
  <path d="M920 596 H956" class="flow"/><text x="968" y="601" class="body">Numbered order placement flow</text>
  <path d="M920 619 H956" class="connector"/><text x="968" y="624" class="body">Module dependency / data access</text>

  <!-- architecture relationships -->
  <path d="M455 336 V370 H700 V434" class="connector"/>
  <path d="M455 370 H175 V434" class="connector"/>
  <path d="M735 336 V376 H380 V434" class="connector"/>
  <path d="M175 336 V376 H432 V548" class="connector"/>
  <path d="M735 336 V540 H690 V548" class="connector"/>
  <path d="M1000 336 V370 H516 V642" class="connector"/>
  <path d="M1000 336 V377 H140 V642" class="connector"/>
  <path d="M690 624 V632 H328 V642" class="connector"/>
  <path d="M432 624 V634 H328 V642" class="connector"/>
  <path d="M328 718 V730 H1034 V503" class="connector"/>
  <path d="M433 530 V538 H688 V548" class="connector"/>
  <text x="1100" y="714" class="small" text-anchor="end">Other modules: reports.js also calls invoice.computeInvoiceFigures</text>

  <!-- numbered placement flow; blue steps track route → libs → persistence -->
  <circle cx="337" cy="281" r="11" class="num"/><text x="337" y="285" class="numtxt">1</text>
  <text x="335" y="348" class="small">Browser POST /api/orders enters routes/orders.js</text>
  <circle cx="605" cy="281" r="11" class="num"/><text x="605" y="285" class="numtxt">2</text>
  <circle cx="804" cy="455" r="11" class="num"/><text x="804" y="459" class="numtxt">3</text>
  <circle cx="571" cy="582" r="11" class="num"/><text x="571" y="586" class="numtxt">4</text>
  <circle cx="462" cy="666" r="11" class="num"/><text x="462" y="670" class="numtxt">5</text>
  <circle cx="356" cy="666" r="11" class="num"/><text x="356" y="670" class="numtxt">6</text>
  <path d="M277 170 H335 V266" class="flow"/>
  <path d="M590 301 H620 V434" class="flow"/>
  <path d="M814 484 C845 510 838 572 814 583" class="flow"/>
  <path d="M572 600 C540 625 500 641 475 650" class="flow"/>
  <path d="M428 681 H416" class="flow"/>
  <text x="866" y="667" class="small">1 request · 2 validate + stock check</text>
  <text x="866" y="687" class="small">3 compute coupon and tax · 4 reserve stock</text>
  <text x="866" y="707" class="small">5 append order + audit · 6 write JSON</text>
  <text x="866" y="727" class="small">Khata charge occurs before stock/order save when selected</text>

  <!-- Supporting dependency arrows -->
  <path d="M554 482 H572" class="connector"/>
  <path d="M814 482 H875 V480 H900" class="connector"/>
</svg>
